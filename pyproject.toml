[project]
name = "speechtotext"
version = "0.6.0.dev0"
description = "Offline speech to text with faster-whisper: audio, ASR and speakers, all local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "speech-to-text",
    "whisper",
    "faster-whisper",
    "asr",
    "diarization",
    "offline",
]
dependencies = [
    "faster-whisper>=1.2,<1.3",
    "typer>=0.26,<0.27",
    "rich>=15,<16",
    "numpy>=2,<3",
    "av>=18,<19",
]

[project.optional-dependencies]
diarize = [
    "pyannote.audio>=4.0",
    "torch>=2.0",
]
# NVIDIA Nemotron-3-Diarization (OpenMDW-1.1, not gated). transformers ships it from 5.18; until
# that release this requirement only resolves against a git install of transformers (docs/speakers.md),
# and once 5.18 is on PyPI it resolves by itself. librosa is the feature extractor's.
nemotron = [
    "transformers>=5.18.0.dev0",
    "torch>=2.0",
    "librosa>=0.10",
]
dev = [
    "hypothesis>=6.156,<7",
    "pytest>=9,<10",
]
mcp = [
    # Official SDK. v2 moved the import (mcp.server.MCPServer, not
    # mcp.server.fastmcp.FastMCP): the major-version ceiling is not decorative.
    "mcp>=2.2,<3",
]

[project.scripts]
speechtotext = "speechtotext.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "real_machine: does not stub core.probe.machine(); the test stubs nvidia-smi and friends",
]
