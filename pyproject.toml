[project]
name = "speechtotext"
version = "0.5.0"
description = "Transcripción offline con faster-whisper: audio, ASR, hablantes y evaluación, todo local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "speech-to-text",
    "whisper",
    "faster-whisper",
    "asr",
    "diarization",
    "offline",
]
dependencies = [
    "faster-whisper>=1.2,<1.3",
    "typer>=0.26,<0.27",
    "rich>=15,<16",
    "numpy>=2,<3",
    "av>=18,<19",
]

[project.optional-dependencies]
diarize = [
    "pyannote.audio>=4.0",
    "torch>=2.0",
]
evaluation = [
    "scikit-learn>=1.9,<2",
    "scipy>=1.17.1,<1.18",
]
dev = [
    "hypothesis>=6.156,<7",
    "pytest>=9,<10",
]

[project.scripts]
speechtotext = "speechtotext.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
