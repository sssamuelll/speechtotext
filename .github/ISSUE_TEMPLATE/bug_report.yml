name: Bug report
description: Something did not do what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The `probe` output below is what makes it reproducible: it says what your machine has and which route the CLI took. Paste it whole.
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What came out, with the whole error if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: textarea
    id: probe
    attributes:
      label: Output of `speechtotext probe`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag you installed (for example `v0.6.0`), or the commit.
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: The audio
      description: Duration, format, how many people speak. A synthetic clip that reproduces the problem is worth more than a description.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not attached a recording I would not publish.
          required: true
