# Runs the suite outside the development machine.
#
# The reason isn't ceremonial: this project installs in editable mode, and its .pth
# has ended up pointing at a different tree than the one being edited, so a "green"
# check ran old code without anyone noticing. There's no inherited venv or ambiguous
# worktree here: it clones, installs, and runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow runs tests, it doesn't write anything to the repo. The
# token's default is broader, and that isn't needed here.
permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # No fail-fast: if it breaks on just one OS, that IS the finding.
      fail-fast: false
      matrix:
        # The three OSes for the two ends of what's supported. 3.11 is the floor that
        # requires-python declares and that nobody tests locally; 3.14 is what the
        # development machine runs. What's in between gets interpolated. If some wheel
        # (av, numpy) doesn't exist yet for 3.14 on some OS, THAT pair drops to 3.13
        # and gets noted here; not the whole matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Without this, the token stays in git's local config while code from the
          # PR runs. Nothing gets pushed from here, so it isn't needed.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Without the `diarize` extra: torch and pyannote come in through a lazy import
      # inside speakers/diarization.py, and the tests that touch them seed a stand-in
      # in sys.modules, so installing them would add close to a gigabyte of download
      # to not run one extra line.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The `mcp` extra is a few MB and does NOT cost a gigabyte: the reason it isn't
      # installed everywhere is that there's no need to repeat it six times. But it
      # has to live somewhere, because `test_serve_registers_against_the_real_sdk`
      # skips without it, and it's the only thing that checks the SDK's API still
      # matches what serve() assumes. Without this step, the day `mcp` moves
      # something the suite stays green and the command breaks on the user's
      # machine.
      - name: Install the MCP SDK (one job only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: pip install -e ".[mcp]"

      # The whole suite runs without a GPU, without network, and without models:
      # tests/conftest.py gives every test a fixed probed machine and a temporary
      # SPEECHTOTEXT_HOME.
      - name: Tests
        run: pytest -q

  package:
    # The suite passing against the tree doesn't prove the package works: a
    # subpackage that packages.find misses, a badly written entry point, a module
    # that only resolved through the editable .pth. Here it installs the way a user
    # installs it.
    name: wheel + clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # The floor: if the wheel builds and installs on 3.11, it installs
          # everywhere.
          python-version: "3.11"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # A separate venv with only the wheel: if anything in the package depended on
      # the tree, it breaks here.
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      # `probe` is the honest smoke test: it imports core.probe and core.enginepin,
      # probes the machine (no GPU or whisper.cpp on the runner), and prints the path
      # it would choose. It doesn't download models, doesn't touch the network, and
      # exits 0 even if RAM wouldn't be enough for large-v3.
      - name: Smoke
        run: |
          /tmp/clean/bin/speechtotext --help
          /tmp/clean/bin/speechtotext probe
