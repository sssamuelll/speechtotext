# Corre la suite fuera de la máquina de desarrollo.
#
# El motivo no es ceremonial: este proyecto se instala en modo editable y su .pth ha
# llegado a apuntar a un árbol distinto del que se estaba editando, con lo que una
# verificación "verde" corría código viejo sin que nadie lo notara. Aquí no hay venv
# heredado ni worktree ambiguo: se clona, se instala y se corre.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: este workflow corre tests, no escribe nada en el repo. El default
# del token es mas amplio y aqui no hace falta.
permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Sin fail-fast: si rompe en un solo sistema operativo, eso ES el dato.
      fail-fast: false
      matrix:
        # Los tres sistemas por los dos extremos de lo soportado. 3.11 es el piso que
        # declara requires-python y que nadie prueba en local; 3.14 es lo que corre la
        # maquina de desarrollo. Lo de en medio se interpola. Si alguna rueda (av, numpy)
        # todavia no existe para 3.14 en algun sistema, se baja ESE par a 3.13 y se anota
        # aqui; no la matriz entera.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Sin esto el token queda en la config local de git mientras corre codigo
          # que viene del PR. No se hace push desde aqui, asi que no se necesita.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Sin el extra `diarize`: torch y pyannote entran por import perezoso dentro de
      # speakers/diarization.py y los tests que los tocan siembran un doble en
      # sys.modules, asi que instalarlos anadiria cerca de un giga de descarga para no
      # ejecutar una linea mas.
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # El extra `mcp` son unos pocos MB y NO cuesta un giga: la razon de no ponerlo en
      # todas partes es que no hace falta repetirlo seis veces. Pero en algun sitio tiene
      # que estar, porque `test_serve_registra_contra_el_sdk_real` se salta sin el y es lo
      # unico que comprueba que el API del SDK sigue siendo el que serve() asume. Sin este
      # paso, el dia que `mcp` mueva algo la suite sigue verde y el comando revienta en la
      # maquina del usuario.
      - name: Instalar el SDK de MCP (un solo job)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: pip install -e ".[mcp]"

      # La suite entera corre sin GPU, sin red y sin modelos: tests/conftest.py le da a
      # cada test una maquina sondeada fija y un SPEECHTOTEXT_HOME temporal.
      - name: Tests
        run: pytest -q

  package:
    # Que la suite pase sobre el arbol no prueba que el paquete sirva: un subpaquete que
    # no entra en packages.find, un entry point mal escrito, un modulo que solo se
    # resolvia por el .pth del editable. Aqui se instala como lo instala un usuario.
    name: wheel + instalación limpia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # El piso: si el wheel se construye e instala en 3.11, se instala en todas.
          python-version: "3.11"

      - name: Construir el wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Venv aparte y solo el wheel: si algo del paquete dependia del arbol, revienta aqui.
      - name: Instalar el wheel en un venv limpio
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/pip install dist/*.whl

      # `probe` es la prueba de humo honesta: importa core.probe y core.enginepin, sondea
      # la maquina (sin GPU ni whisper.cpp en el runner) e imprime la ruta que elegiria.
      # No baja modelos, no toca red, y sale 0 incluso si la RAM no diera para large-v3.
      - name: Humo
        run: |
          /tmp/limpio/bin/speechtotext --help
          /tmp/limpio/bin/speechtotext probe
